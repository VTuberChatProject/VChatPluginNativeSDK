[package]
name = "vchat-plugin-api"
version = "0.2.0"
edition = "2024"

[lib]
path = "lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
host-protocol = ["dep:prost"]
sdk-dev = []

[dependencies]
prost = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
vchat-core = { path = ".." }
